<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終極居住命運拉扯戰：12 階動態對決</title>
<style>
:root{--bg:#0d1020;--card:#1a1f38;--tx:#f4f6ff;--mut:#9aa3c7;--a:#3b82f6;--b:#fb923c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:#3a4172}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:12px;border-radius:10px;border:2px solid #3a4172;background:#0d1020;color:var(--tx);width:100%}
.btnA{background:var(--a)}.btnB{background:var(--b);color:#1a1000}
h1{margin:0;font-size:1.3em}.mut{color:var(--mut)}.wrap{max-width:560px;margin:0 auto;padding:16px}
.pick{display:block;width:100%;text-align:left;margin:10px 0;padding:18px;font-size:1.1em;border:4px solid transparent}
.pick.on{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700}
.open{background:#16a34a}.lock{background:#dc2626}
/* display */
.d{padding:20px 28px;min-height:100vh}.d header{display:flex;justify-content:space-between;align-items:center;gap:20px}
.d h1{font-size:2.2vw}.cnt{font-size:6vw;font-weight:900;color:#fde047;min-width:8vw;text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}
.zone{background:var(--card);border-radius:20px;padding:20px;border-top:10px solid}
.zA{border-color:var(--a)}.zB{border-color:var(--b)}
.zone h2{margin:0;font-size:2.4vw}.pct{font-size:7vw;font-weight:900;line-height:1}
.zA .pct{color:var(--a)}.zB .pct{color:var(--b)}.zone li{font-size:1.8vw;margin:.4em 0}
.bar{display:flex;height:4.5vw;border-radius:14px;overflow:hidden;background:#333}
.bar div{display:flex;align-items:center;justify-content:center;font-size:2vw;font-weight:800;transition:width .5s}
.tags span{display:inline-block;margin:4px;padding:4px 12px;border-radius:99px;font-size:1.5vw}
.zA .tags span{background:rgba(59,130,246,.3)}.zB .tags span{background:rgba(251,146,60,.3)}
.stage{background:var(--card);border-radius:20px;padding:14px 22px;font-size:2vw}
#qr{background:#fff;padding:8px;border-radius:10px}
/* host */
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.row button{flex:1 1 140px}
.panel{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #333;text-align:center}
</style></head>
<body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== 1. 貼上你的 Firebase 設定 (見 README) ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAw4-EW-mzPq6Li1Qbsj5uBgZRpN1KR-qQ",
  authDomain: "community-psychology.firebaseapp.com",
  databaseURL: "https://community-psychology-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "community-psychology",
  storageBucket: "community-psychology.firebasestorage.app",
  messagingSenderId: "807140314531",
  appId: "1:807140314531:web:49232936a04d37a1c75e16"
};

/* ====== 2. 12 階段內容 [標題, 圖示, 說明, A條件[], B條件[]] ====== */
const A_NAME="A 區：新穎小宅", B_NAME="B 區：老舊大空間";
const STAGES=[
["基本屋況","🏠","屋況與空間是最直覺的選擇依據。",["屋齡約 5 年，22 坪，設備新、格局方正"],["屋齡約 35 年，45 坪，需要修繕但空間寬敞"]],
["交通通勤","🚗","通勤時間會吸走生活與休息的時間。",["開車單程約 75 分鐘，大眾運輸班次少"],["步行 8 分鐘到捷運，約 15 分鐘到市中心"]],
["物理環境品質","🌳","綠地、噪音與空氣品質影響日常壓力。",["周邊工地與主幹道多，噪音與空污較明顯，綠地少"],["巷弄安靜，步行 5 分鐘有公園，空氣較佳"]],
["住房擁擠度","👥","居住空間與人口密度影響隱私與壓力。",["人口密度高，戶均空間小，鄰戶很近"],["人口密度低，每人可用空間寬鬆"]],
["區域經濟","💰","收入、失業與經濟剝奪會影響整體生活壓力。",["居民平均收入較高，失業率較低"],["居民收入偏低，失業與經濟壓力較明顯"]],
["社會凝聚力","🤝","鄰里互助、社區參與與居住穩定。",["住戶流動快，多數人不認識鄰居，少有社區活動"],["住戶久居，鄰里互助與社區活動活躍"]],
["心理危機與支持","💬","社會孤立與社會支持與心理健康風險相關。",["孤立情形較多，遇到困難多半獨自承擔"],["鄰里會互相關心，有人異狀時容易被注意到"]],
["選擇性人口遷移","🚚","誰留下、誰離開，會改變社區資源。",["年輕家庭持續遷入，商店與學校逐漸增加"],["年輕人外移、老齡化，商店與診所逐漸減少"]],
["童年累積效應","🧒","不同生命階段的居住經驗會累積成長期健康影響。",["孩子成長過程常搬家、轉學，同儕關係難延續"],["孩子長期在同一社區成長，但部分家庭資源不足"]],
["主觀感知與社區品質","💗","同樣的環境，居民感受可能不同。",["居民認為環境整潔安全，但歸屬感低"],["居民歸屬感高、自覺幸福，但對老舊設施不滿"]],
["行政標籤與實質社區","🗺️","行政區分類不等於真實的生活與支持網絡。",["被稱為「優質新興區」，但生活圈分散、連結薄弱"],["被貼上「衰退區」標籤，實際上有緊密的支持網絡"]],
["社區心理學系統介入","🌱","改善居住環境，也可以改善社區的條件。",["導入社區賦權與跨專業合作，逐步建立鄰里連結"],["推動地方創生與社區照顧網絡，修繕老屋、留住青年"]]
];
const N=STAGES.length, INIT={stage:0,shown:false,open:false,endsAt:null,final:false};

/* ====== 3. 啟動 ====== */
  window.addEventListener("unhandledrejection",e=>alert("錯誤："+(e.reason&&e.reason.message||e.reason)));
const P=new URLSearchParams(location.search);
const room=(P.get("room")||"class1").replace(/[^\w-]/g,"").slice(0,20)||"class1";
const role=["display","host"].includes(P.get("role"))?P.get("role"):"player";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let st={...INIT}, votes={}, hist={}, offset=0, user=null, hostErr="", qrDone=false;
if(!FIREBASE_CONFIG.apiKey){
  app.innerHTML='<div class="wrap"><h1>尚未設定 Firebase</h1><p class="mut">請依 README 把 Firebase 設定貼到 index.html 最上方的 FIREBASE_CONFIG。</p></div>';
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database(), auth=firebase.auth();
  const R=db.ref("rooms/"+room), S=R.child("state"), V=R.child("votes"), H=R.child("history");
  db.ref(".info/serverTimeOffset").on("value",s=>offset=s.val()||0);
  const now=()=>Date.now()+offset;
  const counts=()=>{let a=0,b=0;Object.values(votes).forEach(v=>v.side==="A"?a++:v.side==="B"&&b++);return{a,b}};
  const lock=()=>{const c=counts();S.update({open:false,endsAt:null});if(st.stage>0)H.child(st.stage).set({A:c.a,B:c.b});};
  auth.onAuthStateChanged(u=>{
    user=u;
    if(role==="host"&&u&&u.isAnonymous){auth.signOut();return}
    if(!u&&role!=="host"){auth.signInAnonymously().catch(e=>app.innerHTML="匿名登入失敗："+esc(e.message));return}
    S.on("value",s=>{st={...INIT,...(s.val()||{})};render()});
    V.on("value",s=>{votes=s.val()||{};render()});
    H.on("value",s=>{hist=s.val()||{};render()});
    if(role==="host"&&u)S.once("value",s=>{if(!s.exists())S.set(INIT)});
  });
  setInterval(()=>{ // 每 250ms 更新倒數；主持人頁面負責時間到自動鎖定
    const t=$("#cnt");if(t)t.textContent=st.open&&st.endsAt?Math.max(0,Math.ceil((st.endsAt-now())/1000)):"";
    if(role==="host"&&user&&st.open&&st.endsAt&&now()>=st.endsAt)lock();
  },250);

  const bars=()=>{const c=counts(),t=c.a+c.b,pa=t?Math.round(c.a/t*100):0,pb=t?100-pa:0;return{c,t,pa,pb}};
  const names=side=>Object.values(votes).filter(v=>v.side===side).map(v=>`<span>${esc(v.name)}</span>`).join("");
  const stageObj=()=>STAGES[st.stage-1];
  const status=()=>`<span class="badge ${st.open?"open":"lock"}">${st.open?"投票開放":"投票鎖定"}</span>`;

  function render(){
    if(role==="player")return renderPlayer();
    if(role==="display")return renderDisplay();
    renderHost();
  }

  /* --- 學生手機 --- */
  function renderPlayer(){
    if(!user)return;
    const me=votes[user.uid], saved=localStorage.getItem("nick")||"";
    const keep=$("#nick")?$("#nick").value:saved;
    const s=st.stage>0?stageObj():null;
    const btn=(k,label,cls)=>`<button class="pick ${cls} ${me&&me.side===k?"on":""}" ${st.open?"":"disabled"} data-side="${k}">${label}${me&&me.side===k?" ✔ 目前選擇":""}</button>`;
    app.innerHTML=`<div class="wrap"><h1>🏘️ 終極居住命運拉扯戰</h1>
    <p>${st.final?"最終結果":s?`第 ${st.stage}/${N} 階段：${s[0]}`:"等待老師開始…"} ${status()} <span id="cnt" style="font-size:1.6em;font-weight:900"></span></p>
    <p class="mut">暱稱僅用於本次課堂活動顯示，活動資料由老師清除。請勿輸入真實姓名或個資。</p>
    <input id="nick" maxlength="12" placeholder="輸入暱稱（最多 12 字）" value="${esc(keep)}">
    ${btn("A",A_NAME,"btnA")}${btn("B",B_NAME,"btnB")}
    <p>${me?`你目前支持 <b>${me.side} 區</b>，${st.open?"可隨時換邊":"投票已鎖定"}`:"請輸入暱稱並選擇一個區域"}</p>
    ${st.shown&&s?`<div class="panel"><b>${s[1]} ${s[0]}</b><p class="mut">${s[2]}</p><p style="color:#93c5fd">A：${s[3].join("；")}</p><p style="color:#fdba74">B：${s[4].join("；")}</p></div>`:""}</div>`;
    app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
      const name=$("#nick").value.trim();
      if(!name){alert("請先輸入暱稱");return}
      localStorage.setItem("nick",name);
      V.child(user.uid).set({name,side:b.dataset.side}).catch(e=>alert("投票失敗（可能已鎖定）："+e.message));
    });
  }

  /* --- 投影幕 --- */
  function renderDisplay(){
    const {c,pa,pb}=bars(), s=st.stage>0?stageObj():null;
    const zone=(k,nm,cond,n,p,nameHtml)=>`<div class="zone z${k}"><h2>${nm}</h2><ul>${st.shown&&cond?cond.map(x=>`<li>${esc(x)}</li>`).join(""):'<li class="mut">條件尚未揭露…</li>'}</ul><div class="pct">${p}%</div><div style="font-size:2.4vw">${n} 人</div><div class="tags">${nameHtml}</div></div>`;
    if(st.final){
      app.innerHTML=`<div class="d"><h1>🏁 最終結果</h1><table style="font-size:1.8vw"><tr><th>階段</th><th>A 區</th><th>B 區</th></tr>${STAGES.map((x,i)=>{const h=hist[i+1];return`<tr><td>${i+1}. ${x[0]}</td><td>${h?h.A:"-"}</td><td>${h?h.B:"-"}</td></tr>`}).join("")}</table><p style="font-size:2vw">討論：哪些條件改變了你的選擇？為什麼？居住環境如何影響身心健康？</p></div>`;return}
    app.innerHTML=`<div class="d"><header><h1>🏘️ 終極居住命運拉扯戰：12 階動態對決</h1><div id="qrbox" style="display:${st.stage===0?"block":"none"}"><div id="qr"></div></div><div class="cnt" id="cnt"></div>${status()}</header>
    <div class="stage">${s?`${s[1]} 第 ${st.stage}/${N} 階段：${s[0]} <span class="mut">— ${s[2]}</span>`:"📱 掃描 QR Code 加入，輸入暱稱並選擇居住區域"}</div>
    <div class="cards">${zone("A",A_NAME,s&&s[3],c.a,pa,names("A"))}${zone("B",B_NAME,s&&s[4],c.b,pb,names("B"))}</div>
    <div class="bar"><div style="width:${pa}%;background:var(--a)">${pa?pa+"%":""}</div><div style="width:${pb}%;background:var(--b);color:#1a1000">${pb?pb+"%":""}</div></div>
    <div style="margin-top:12px;display:${st.stage===0?"none":"flex"};align-items:center;gap:12px"><div id="qr2" style="background:#fff;padding:4px;border-radius:8px"></div><span class="mut">隨時掃描加入</span></div></div>`;
    const url=location.origin+location.pathname+"?room="+room;
    ["qr","qr2"].forEach((id,i)=>{const el=$("#"+id);if(el&&window.QRCode)new QRCode(el,{text:url,width:i?96:220,height:i?96:220})});
  }

  /* --- 主持人 --- */
  function renderHost(){
    if(!user){
      app.innerHTML=`<div class="wrap"><h1>主持人登入</h1><p class="mut">房間：${esc(room)}</p><input id="em" placeholder="Email" type="email"><br><br><input id="pw" placeholder="密碼" type="password"><p style="color:#f87171">${esc(hostErr)}</p><button class="btnA" id="login">登入</button></div>`;
      $("#login").onclick=()=>auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).catch(e=>{hostErr=e.message;renderHost()});return}
    const {c,pa,pb}=bars(), s=st.stage>0?stageObj():null, ent=Object.entries(votes);
    app.innerHTML=`<div class="wrap"><h1>🎛️ 主持人控制台 <span class="mut" style="font-size:.6em">房間 ${esc(room)}</span></h1>
    <div class="panel"><b>${st.stage===0?"大廳（尚未開始）":`第 ${st.stage}/${N} 階段：${s[0]}`}</b> ${status()} <span id="cnt" style="font-size:1.6em;font-weight:900"></span>
    <p style="font-size:1.4em">A：${c.a} 人（${pa}%）　B：${c.b} 人（${pb}%）</p>
    <p class="mut">${s?s[2]:""}</p>${st.shown?"<p>✅ 條件已揭露</p>":"<p>條件未揭露</p>"}</div>
    <div class="row"><button id="prev" ${st.stage<=0?"disabled":""}>⬅ 上一階段</button><button id="next" class="btnA" ${st.stage>=N?"disabled":""}>下一階段 ➡</button></div>
    <div class="row"><button id="reveal" ${st.stage<1?"disabled":""}>👁 揭露條件</button><button id="start" class="btnB" ${st.stage<1?"disabled":""}>⏱ 開始 10 秒倒數</button></div>
    <div class="row"><button id="open">🔓 開放投票</button><button id="lock">🔒 鎖定投票</button></div>
    <div class="row"><button id="final">🏁 顯示最終結果</button><button id="back">↩ 回到對決畫面</button></div>
    <div class="row"><button id="clear" style="background:#991b1b">🗑 清空並重新開始</button><button id="out">登出</button></div>
    <div class="panel"><b>投影幕網址</b><br><small id="u1"></small><br><b>學生網址</b><br><small id="u2"></small></div>
    <div class="panel"><b>參與者（${ent.length}）</b><br>${ent.map(([k,v])=>`<span style="color:${v.side==="A"?"#93c5fd":"#fdba74"}">${esc(v.name)}(${v.side})</span>`).join("　")||"<span class='mut'>尚無</span>"}</div>
    <div class="panel"><b>各階段結果</b><table><tr><th>階段</th><th>A</th><th>B</th></tr>${STAGES.map((x,i)=>{const h=hist[i+1];return h?`<tr><td>${i+1}. ${x[0]}</td><td>${h.A}</td><td>${h.B}</td></tr>`:""}).join("")}</table></div></div>`;
    const base=location.origin+location.pathname+"?room="+room;
    $("#u1").textContent=base+"&role=display";$("#u2").textContent=base;
    const go=d=>()=>{if(st.open)lock();S.update({stage:st.stage+d,shown:false,open:false,endsAt:null,final:false})};
    $("#prev").onclick=go(-1);$("#next").onclick=go(1);
    $("#reveal").onclick=()=>S.update({shown:true});
    $("#start").onclick=()=>S.update({shown:true,open:true,endsAt:now()+10000});
    $("#open").onclick=()=>S.update({open:true,endsAt:null});
    $("#lock").onclick=lock;
    $("#final").onclick=()=>{if(st.open)lock();S.update({final:true})};
    $("#back").onclick=()=>S.update({final:false});
    $("#clear").onclick=()=>{if(confirm("確定清空全部投票與紀錄？"))Promise.all([V.remove(),H.remove(),S.set(INIT)])};
    $("#out").onclick=()=>auth.signOut();
  }
}
</script></body></html>
