<!DOCTYPE html>
<html lang="zh-Hant" style="color-scheme:light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終極居住命運拉扯戰：12 階動態對決</title>
<style>
:root{
  --sage:#8FA898;--sage-l:#EBF0EB;--sage-d:#4A6050;
  --clay:#B89A88;--clay-l:#F2EDE8;--clay-d:#785040;
  --dusk:#9898B0;--dusk-l:#EBEBF2;--dusk-d:#484868;
  --stone:#A8A49A;--stone-d:#585248;
  --mist:#9AAAB8;--mist-l:#E8EDF1;--mist-d:#485870;
  --brd:rgba(168,158,145,.22);
  --tx:#2C2820;--tx2:#4C4238;--tx3:#7A7068;
  --bg:#F6F4EE;--card:#FFFFFF;--a:var(--mist);--b:var(--clay);--mut:var(--tx3)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--brd);border-radius:12px;padding:12px 16px;color:var(--sage-d);background:var(--sage-l)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:12px;border-radius:10px;border:2px solid #D6D0C4;background:#fff;color:var(--tx);width:100%}
input:focus{outline:none;border-color:var(--sage)}
.btnP{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.btnA{background:var(--mist-l);color:var(--mist-d)}
.btnB{background:var(--clay-l);color:var(--clay-d)}
h1{margin:0;font-size:1.3em;color:var(--sage-d)}.mut{color:var(--tx3)}.wrap{max-width:560px;margin:0 auto;padding:16px}
.pick{display:block;width:100%;text-align:left;margin:10px 0;padding:18px;font-size:1.1em;border:4px solid transparent}
.pick.btnA.on{border-color:var(--mist-d);background:var(--mist);color:var(--tx)}
.pick.btnB.on{border-color:var(--clay-d);background:var(--clay);color:var(--tx)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;color:#fff}
.open{background:var(--sage-d)}.lock{background:var(--clay-d)}
/* display：永遠一屏、高對比 */
.d{--tx:#1A1612;--tx2:#3A3128;padding:.8vw 1.6vw 1vw;min-height:100vh;color:var(--tx)}
.d header{display:flex;justify-content:space-between;align-items:center;gap:1.2vw}
.d h1{font-size:clamp(16px,1.8vw,36px);color:var(--sage-d)}
.d .badge{font-size:clamp(14px,1.5vw,30px);padding:.25vw 1.1vw}
.cnt{font-size:clamp(26px,3.4vw,68px);font-weight:900;color:var(--clay-d);min-width:4.5vw;text-align:center;line-height:1}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:1vw;margin-top:.6vw}
.vz{background:#fff;border:3px solid;border-radius:.9vw;padding:.4vw 1.1vw;display:flex;flex-wrap:wrap;align-items:center;gap:.2vw 1vw}
.vA{border-color:var(--mist-d);color:var(--mist-d)}.vB{border-color:var(--clay-d);color:var(--clay-d)}
.vh,.vn{font-size:clamp(15px,1.6vw,32px);font-weight:800}
.vn{margin-left:auto}
.tags{flex-basis:100%}
.tags span{display:inline-block;margin:.15em;padding:.1em .7em;border-radius:99px;font-size:var(--nf,16px);font-weight:600}
.vA .tags span{background:var(--mist-d);color:#fff}.vB .tags span{background:var(--clay-d);color:#fff}
.bar{display:flex;height:clamp(18px,1.8vw,36px);border-radius:.9vw;overflow:hidden;background:#D9D4C8;margin:.5vw 0}
.bar div{display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.2vw,24px);font-weight:800;transition:width .5s;color:#fff}
/* 條件區：字級由 JS 依階段數自動縮放，確保一屏放得下 */
#conds{font-size:2vw}
.stg{display:grid;grid-template-columns:7.5em 1fr 1fr;gap:.45em;margin-top:.4em;align-items:stretch}
.sl{display:flex;align-items:center;font-size:.8em;font-weight:800;color:var(--sage-d);line-height:1.25}
.cell{border:2px solid;border-radius:.5em;padding:.25em .6em;line-height:1.35;color:var(--tx);font-weight:600}
.cell.A{background:var(--mist-l);border-color:var(--mist-d)}.cell.B{background:var(--clay-l);border-color:var(--clay-d)}
.ab{display:inline-block;min-width:1.4em;text-align:center;margin-right:.4em;border-radius:.3em;color:#fff;font-weight:800;font-size:.85em}
.cell.A .ab{background:var(--mist-d)}.cell.B .ab{background:var(--clay-d)}
.stg.cur .cell{font-size:1.15em;font-weight:700;border-width:4px}
.stg.cur .sl{font-size:.95em}
.lobby{background:#fff;border:3px solid var(--sage-d);border-radius:1vw;padding:1.2vw 1.6vw;margin-top:.8vw}
.lt{font-size:clamp(18px,2.4vw,48px);font-weight:800;color:var(--sage-d)}
.lobby .tags span{background:var(--sage-d);color:#fff}
.rt{font-size:clamp(14px,1.8vw,36px)}.rt th{background:var(--sage-d);color:#fff}
.rt td,.rt th{padding:.5vw;border-bottom:2px solid rgba(44,40,32,.25)}
.rt td:nth-child(2){color:var(--mist-d);font-weight:800}.rt td:nth-child(3){color:var(--clay-d);font-weight:800}
#qr{background:#fff;padding:8px;border-radius:10px;border:2px solid var(--sage-d)}
/* host */
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.row button{flex:1 1 140px}
.panel{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px;margin:12px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--brd);text-align:center}
</style></head>
<body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== 1. 貼上你的 Firebase 設定 (見 README) ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAw4-EW-mzPq6Li1Qbsj5uBgZRpN1KR-qQ",
  authDomain: "community-psychology.firebaseapp.com",
  databaseURL: "https://community-psychology-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "community-psychology",
  storageBucket: "community-psychology.firebasestorage.app",
  messagingSenderId: "807140314531",
  appId: "1:807140314531:web:49232936a04d37a1c75e16"
};

/* ====== 2. 12 階段內容 [標題, 圖示, 說明, A條件[], B條件[]] ====== */
const A_NAME="A 區：精緻小宅", B_NAME="B 區：大坪數房子";
const STAGES=[
["基本屋況","🏠","屋況與空間是最直覺的選擇依據。",["全新完工，設備新、採光佳、乾濕分離衛浴"],["屋齡約35年，無電梯，部分設備需要修繕，但位於蛋黃區黃金地段，生活機能極佳"]],
["交通通勤","🚗","通勤時間會吸走生活與休息的時間。",["大眾運輸尚未完善，每天上班開車通勤需45分鐘，且塞車與油錢負擔重"],["樓下就是雙捷運交會站與公車樞紐，15分鐘到哪都行"]],
["環境品質","🌳","綠地、噪音與空氣品質影響日常壓力。",["緊鄰河濱綠地公園，空氣清新，夜晚極度寧靜無車聲"],["樓下就是熱鬧夜市與餐飲街，半夜經常有油煙味、廢氣與醉客噪音困擾"]],
["住房擁擠度","👥","居住空間與人口密度影響隱私與壓力。",["單身套房為主，無過度擁擠問題"],["分租套房多，且平均每間住超過1人，呈現過度擁擠"]],
["區域經濟","💰","收入、失業與經濟剝奪會影響整體生活壓力。",["居民平均收入較高，失業率較低"],["居民收入偏低，失業與經濟壓力較明顯"]],
["社會凝聚力","🤝","鄰里互助、社區參與與居住穩定。",["半年換一次鄰居，門口裝監視器戒備，投票率僅8%"],["全棟都是住了幾十年的老住戶，鄰里互助代收快遞，投票參與率高達85%"]],
["心理危機與支持","💬","社會孤立與社會支持與心理健康風險相關。",["孤立情形較多，遇到困難多半獨自承擔"],["鄰里會互相關心，社區活動活躍，有人有異狀時容易被注意到"]],
["發展前景與選擇性人口遷移","🚚","誰留下、誰離開，會改變社區資源。",["周邊即將引進大型科技園區，吸引大量高學歷、高收入年輕家庭移入，商店與學校逐漸增加"],["年輕人外移、社區老齡化，商店與診所逐漸減少"]],
["童年累積效應","🧒","不同生命階段的居住經驗會累積成長期健康影響。",["研究顯示，搬到A區能把成年後的長期患病率壓低至90。"],["研究顯示：留在B區，童年與成年的雙重累積效應會讓你的長期患病率飆升至186"]],
["主觀感知與社區品質","💗","同樣的環境，居民感受可能不同。",["大樓管委會天天爆發住戶公設產權官司與冷漠敵意，居民對「社區社會品質」滿意度極低"],["雖然硬體老舊，但居民自發成立巡守隊與共餐點，「心理社區感」極高。"]],
["行政標籤與實質社區","🗺️","行政區分類不等於真實的生活與支持網絡。",["被政府評為「優質示範行政區」"],["被政府劃為「高風險補助區」"]],
["社區心理學系統介入","🌱","改善居住環境，也可以改善社區的條件。",["導入社區賦權與跨專業合作，逐步建立鄰里連結"],["推動地方創生、青年共生住宅與C級巷弄照顧站，修繕老屋、留住青年"]]
];
const N=STAGES.length, INIT={stage:0,shown:false,open:false,endsAt:null,final:false};

/* ====== 3. 啟動 ====== */
  window.addEventListener("unhandledrejection",e=>alert("錯誤："+(e.reason&&e.reason.message||e.reason)));
const P=new URLSearchParams(location.search);
const room=(P.get("room")||"class1").replace(/[^\w-]/g,"").slice(0,20)||"class1";
const role=["display","host"].includes(P.get("role"))?P.get("role"):"player";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let st={...INIT}, votes={}, hist={}, offset=0, user=null, hostErr="", qrDone=false, votesLoaded=false, reg=false;
if(!FIREBASE_CONFIG.apiKey){
  app.innerHTML='<div class="wrap"><h1>尚未設定 Firebase</h1><p class="mut">請依 README 把 Firebase 設定貼到 index.html 最上方的 FIREBASE_CONFIG。</p></div>';
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database(), auth=firebase.auth();
  const R=db.ref("rooms/"+room), S=R.child("state"), V=R.child("votes"), H=R.child("history");
  db.ref(".info/serverTimeOffset").on("value",s=>offset=s.val()||0);
  const now=()=>Date.now()+offset;
  const counts=()=>{let a=0,b=0;Object.values(votes).forEach(v=>v.side==="A"?a++:v.side==="B"&&b++);return{a,b}};
  const lock=()=>{const c=counts();S.update({open:false,endsAt:null});if(st.stage>0)H.child(st.stage).set({A:c.a,B:c.b});};
  auth.onAuthStateChanged(u=>{
    user=u;
    if(role==="host"&&u&&u.isAnonymous){auth.signOut();return}
    if(!u&&role!=="host"){auth.signInAnonymously().catch(e=>app.innerHTML="匿名登入失敗："+esc(e.message));return}
    S.on("value",s=>{st={...INIT,...(s.val()||{})};render()});
    V.on("value",s=>{votes=s.val()||{};votesLoaded=true;render()});
    H.on("value",s=>{hist=s.val()||{};render()});
    if(role==="host"&&u)S.once("value",s=>{if(!s.exists())S.set(INIT)});
  });
  setInterval(()=>{ // 每 250ms 更新倒數；主持人頁面負責時間到自動鎖定
    const t=$("#cnt");if(t)t.textContent=st.open&&st.endsAt?Math.max(0,Math.ceil((st.endsAt-now())/1000)):"";
    if(role==="host"&&user&&st.open&&st.endsAt&&now()>=st.endsAt)lock();
  },250);

  const bars=()=>{const c=counts(),t=c.a+c.b,pa=t?Math.round(c.a/t*100):0,pb=t?100-pa:0;return{c,t,pa,pb}};
  const names=side=>Object.values(votes).filter(v=>v.side===side).map(v=>`<span>${esc(v.name)}</span>`).join("");
  const stageObj=()=>STAGES[st.stage-1];
  const revealed=()=>st.stage>0?(st.shown?st.stage:st.stage-1):0;
  const status=()=>`<span class="badge ${st.open?"open":"lock"}">${st.open?"投票開放":"投票鎖定"}</span>`;

  function render(){
    if(role==="player")return renderPlayer();
    if(role==="display")return renderDisplay();
    renderHost();
  }

  /* --- 學生手機 --- */
  function renderPlayer(){
    if(!user)return;
    const nick=localStorage.getItem("nick")||"";
    if(!nick&&$("#join"))return; // 輸入暱稱時不重繪，避免鍵盤收起
    if(!nick){
      app.innerHTML=`<div class="wrap"><h1>🏘️ 終極居住命運拉扯戰</h1>
      <p class="mut">暱稱僅用於本次課堂活動顯示，活動資料將於結束後由主持人清除。</p>
      <input id="nick" maxlength="12" placeholder="輸入暱稱（最多 12 字）"><br><br>
      <button class="btnP" id="join" style="width:100%">加入活動</button></div>`;
      const join=()=>{const n=$("#nick").value.trim();if(!n){alert("請先輸入暱稱");return}localStorage.setItem("nick",n);
        const m=votes[user.uid];V.child(user.uid).set({name:n,side:(m&&m.side)||""}).catch(e=>alert("加入失敗："+e.message+"\n（加入失敗，請向主持人反應。）"));render()};
      $("#join").onclick=join;$("#nick").onkeydown=e=>{if(e.key==="Enter")join()};
      return;
    }
    const me=votes[user.uid], s=st.stage>0?stageObj():null;
    if(votesLoaded&&!me&&!reg){reg=true;V.child(user.uid).set({name:nick,side:""}).catch(()=>{}).finally(()=>reg=false)} // 老師清空後自動重新加入
    const panels=()=>{let h="";const n=revealed();for(let i=n-1;i>=0;i--){const x=STAGES[i],cur=i===n-1;h+=`<div class="panel" style="${cur?"":"opacity:.7"}"><b>${x[1]} 第 ${i+1} 階段：${x[0]}</b>${cur?`<p class="mut">${x[2]}</p>`:""}<p style="color:#485870">A：${x[3].join("；")}</p><p style="color:#785040">B：${x[4].join("；")}</p></div>`}return h};
    const btn=(k,label,cls)=>`<button class="pick ${cls} ${me&&me.side===k?"on":""}" ${st.open?"":"disabled"} data-side="${k}">${label}${me&&me.side===k?" ✔ 目前選擇":""}</button>`;
    app.innerHTML=`<div class="wrap"><h1>🏘️ 終極居住命運拉扯戰</h1>
    <p>${st.final?"最終結果":s?`第 ${st.stage}/${N} 階段：${s[0]}`:"等待老師開始…"} ${status()} <span id="cnt" style="font-size:1.6em;font-weight:900"></span></p>
    <p class="mut">👤 暱稱：<b>${esc(nick)}</b> <button id="chg" style="padding:2px 10px;font-size:.8em">更改</button></p>
    ${btn("A",A_NAME,"btnA")}${btn("B",B_NAME,"btnB")}
    <p>${me&&me.side?`你目前支持 <b>${me.side} 區</b>，${st.open?"可隨時換邊":"投票已鎖定"}`:st.open?"請選擇一個區域":"請等待老師開始下一階段"}</p>
    ${panels()}</div>`;
    $("#chg").onclick=()=>{localStorage.removeItem("nick");render()};
    app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
      V.child(user.uid).set({name:nick,side:b.dataset.side}).catch(e=>alert("投票失敗（可能已鎖定）："+e.message));
    });
  }

  /* --- 投影幕 --- */
  function renderDisplay(){
    const {c,pa,pb}=bars(), s=st.stage>0?stageObj():null, rv=revealed();
    const stg=()=>{let h="";for(let i=rv-1;i>=0;i--){const x=STAGES[i];h+=`<div class="stg ${i===rv-1?"cur":""}"><div class="sl">${x[1]} ${i+1}. ${esc(x[0])}</div><div class="cell A"><b class="ab">A</b>${x[3].map(esc).join("；")}</div><div class="cell B"><b class="ab">B</b>${x[4].map(esc).join("；")}</div></div>`}return h};
    const vz=(k,nm,n,p,nameHtml)=>`<div class="vz v${k}"><div class="vh">${nm}</div><div class="vn">${p}% ・ ${n} 人</div><div class="tags">${nameHtml}</div></div>`;
    if(st.final){
      app.innerHTML=`<div class="d"><h1>🏁 最終結果</h1><table class="rt"><tr><th>階段</th><th>A 區</th><th>B 區</th></tr>${STAGES.map((x,i)=>{const h=hist[i+1];return`<tr><td>${i+1}. ${x[0]}</td><td>${h?h.A:"-"}</td><td>${h?h.B:"-"}</td></tr>`}).join("")}</table><p style="font-size:clamp(16px,2vw,40px);font-weight:700">討論：哪些條件改變了你的選擇？為什麼？居住環境如何影響身心健康？</p></div>`;return}
    const lobby=st.stage===0, all=Object.values(votes);
    app.innerHTML=`<div class="d"><header><h1>🏘️ 終極居住命運拉扯戰${s?`｜第 ${st.stage}/${N} 階段`:""}</h1><div style="display:flex;align-items:center;gap:1.2vw"><div id="qrbox" style="display:${lobby?"block":"none"}"><div id="qr"></div></div><div id="qr2" style="display:${lobby?"none":"block"};background:#fff;padding:3px;border-radius:6px"></div><div class="cnt" id="cnt"></div>${status()}</div></header>
    ${lobby?`<div class="lobby"><div class="lt">📱 掃描 QR Code 加入，輸入暱稱後等待老師開始</div><div class="lt" style="margin:.5vw 0">已加入 ${all.length} 人</div><div class="tags">${all.map(v=>`<span>${esc(v.name)}</span>`).join("")}</div></div>`:
    `<div class="vote">${vz("A",A_NAME,c.a,pa,names("A"))}${vz("B",B_NAME,c.b,pb,names("B"))}</div>
    <div class="bar"><div style="width:${pa}%;background:var(--mist-d)">${pa?pa+"%":""}</div><div style="width:${pb}%;background:var(--clay-d)">${pb?pb+"%":""}</div></div>
    <div id="conds">${stg()}</div>`}</div>`;
    const url=location.origin+location.pathname+"?room="+room;
    ["qr","qr2"].forEach((id,i)=>{const el=$("#"+id);if(el&&window.QRCode)new QRCode(el,{text:url,width:i?64:200,height:i?64:200})});
    // 暱稱全部顯示：字級隨人數自動縮小，限制在固定高度內
    const area=$(lobby?".lobby":".vote");
    if(area){const tg=[...area.querySelectorAll(".tags")],cap=innerHeight*(lobby?0.55:0.13);
      let nf=Math.min(innerWidth*(lobby?0.018:0.0135),lobby?36:26);area.style.setProperty("--nf",nf+"px");
      while(nf>9&&Math.max(...tg.map(t=>t.scrollHeight))>cap){nf-=0.5;area.style.setProperty("--nf",nf+"px")}}
    const box=$("#conds"); // 自動縮放條件字級，直到整頁不超出螢幕
    if(box){let fs=Math.min(innerWidth*0.026,52);box.style.fontSize=fs+"px";
      while(document.documentElement.scrollHeight>innerHeight+1&&fs>10){fs-=0.5;box.style.fontSize=fs+"px"}}
  }
  if(role==="display")addEventListener("resize",()=>renderDisplay());

  /* --- 主持人 --- */
  function renderHost(){
    if(!user){
      app.innerHTML=`<div class="wrap"><h1>主持人登入</h1><p class="mut">房間：${esc(room)}</p><input id="em" placeholder="Email" type="email"><br><br><input id="pw" placeholder="密碼" type="password"><p style="color:#785040">${esc(hostErr)}</p><button class="btnP" id="login">登入</button></div>`;
      $("#login").onclick=()=>auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).catch(e=>{hostErr=e.message;renderHost()});return}
    const {c,pa,pb}=bars(), s=st.stage>0?stageObj():null, ent=Object.entries(votes);
    app.innerHTML=`<div class="wrap"><h1>🎛️ 主持人控制台 <span class="mut" style="font-size:.6em">房間 ${esc(room)}</span></h1>
    <div class="panel"><b>${st.stage===0?"大廳（尚未開始）":`第 ${st.stage}/${N} 階段：${s[0]}`}</b> ${status()} <span id="cnt" style="font-size:1.6em;font-weight:900"></span>
    <p style="font-size:1.4em">A：${c.a} 人（${pa}%）　B：${c.b} 人（${pb}%）</p>
    <p class="mut">${s?s[2]:""}</p>${st.shown?"<p>✅ 條件已揭露</p>":"<p>條件未揭露</p>"}</div>
    <div class="row"><button id="prev" ${st.stage<=0?"disabled":""}>⬅ 上一階段</button><button id="next" class="btnP" ${st.stage>=N?"disabled":""}>下一階段 ➡</button></div>
    <div class="row"><button id="start" ${st.stage<1?"disabled":""}>⏱ 重新倒數 20 秒</button><button id="lock">🔒 立即鎖定投票</button></div>
    <div class="row"><button id="final">🏁 顯示最終結果</button><button id="back">↩ 回到對決畫面</button></div>
    <div class="row"><button id="clear" style="background:var(--clay-d);color:#fff;border-color:var(--clay-d)">🗑 清空並重新開始</button><button id="out">登出</button></div>
    <div class="panel"><b>投影幕網址</b><br><small id="u1"></small><br><b>學生網址</b><br><small id="u2"></small></div>
    <div class="panel"><b>參與者（${ent.length}）</b><br>${ent.map(([k,v])=>`<span style="color:${v.side==="A"?"#485870":v.side==="B"?"#785040":"#7A7068"}">${esc(v.name)}${v.side?`(${v.side})`:""}</span>`).join("　")||"<span class='mut'>尚無</span>"}</div>
    <div class="panel"><b>各階段結果</b><table><tr><th>階段</th><th>A</th><th>B</th></tr>${STAGES.map((x,i)=>{const h=hist[i+1];return h?`<tr><td>${i+1}. ${x[0]}</td><td>${h.A}</td><td>${h.B}</td></tr>`:""}).join("")}</table></div></div>`;
    const base=location.origin+location.pathname+"?room="+room;
    $("#u1").textContent=base+"&role=display";$("#u2").textContent=base;
    // 下一階段：自動揭露條件並開放投票（20 秒倒數，時間到自動鎖定）；上一階段：僅回顧，不開放
    const go=d=>()=>{if(st.open)lock();const n=st.stage+d,auto=d>0&&n>=1;
      S.update({stage:n,shown:n>=1,open:auto,endsAt:auto?now()+20000:null,final:false})};
    $("#prev").onclick=go(-1);$("#next").onclick=go(1);
    $("#start").onclick=()=>S.update({shown:true,open:true,endsAt:now()+20000});
    $("#lock").onclick=lock;
    $("#final").onclick=()=>{if(st.open)lock();S.update({final:true})};
    $("#back").onclick=()=>S.update({final:false});
    $("#clear").onclick=()=>{if(confirm("確定清空全部投票與紀錄？"))Promise.all([V.remove(),H.remove(),S.set(INIT)])};
    $("#out").onclick=()=>auth.signOut();
  }
}
</script></body></html>
